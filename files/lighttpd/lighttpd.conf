server.document-root = "/opt/keen/www"
server.port = 80
server.bind = "0.0.0.0"

server.modules = (
    "mod_auth",
    "mod_authn_file",
    "mod_cgi",
    "mod_access",
    "mod_accesslog",
    "mod_alias",
    "mod_rewrite"
)

server.errorlog = "/opt/var/log/lighttpd/error.log"
accesslog.filename = "/opt/var/log/lighttpd/access.log"

index-file.names = ( "index.html", "index.htm" )

mimetype.assign = (
    ".html" => "text/html",
    ".css"  => "text/css",
    ".js"   => "application/javascript",
    ".json" => "application/json",
    ".png"  => "image/png",
    ".jpg"  => "image/jpeg",
    ".svg"  => "image/svg+xml",
    ".ico"  => "image/x-icon",
    ".woff2"=> "font/woff2"
)

# === Basic auth ===
auth.backend = "plain"
auth.backend.plain.userfile = "/opt/etc/lighttpd/lighttpd.user"
auth.require = ( "/" =>
    (
        "method"  => "basic",
        "realm"   => "Keen UI",
        "require" => "valid-user"
    )
)

alias.url = ( "/cgi-bin/" => "/opt/keen/www/cgi-bin/" )
$HTTP["url"] =~ "^/cgi-bin/" {
    cgi.assign = ( "" => "" )
}
